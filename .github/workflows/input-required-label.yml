name: Input Required Label

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  schedule:
    # Run once daily to catch any missed updates
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  label:
    uses: trancecode/github-workflows/.github/workflows/input-required-label.yml@main
