name: Merge Conflict Label

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    # Run once daily to catch conflicts from base branch changes
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    uses: trancecode/github-workflows/.github/workflows/merge-conflict-label.yml@main
