name: Monthly Workflow Audit

on:
  schedule:
    # Run at midnight on the first day of each month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Allow manual triggering for testing and ad-hoc reviews

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  audit:
    uses: trancecode/github-workflows/.github/workflows/monthly-audit.yml@main
