name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  pages:
    uses: trancecode/github-workflows/.github/workflows/pages-deploy.yml@main
    with:
      path: .
